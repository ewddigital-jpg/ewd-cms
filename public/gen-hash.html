<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>EWD CMS — Passwort-Hash Generator</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:60px auto;padding:0 20px;color:#0d1117;}
  h1{font-size:1.2rem;}
  input{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:1rem;
    box-sizing:border-box;margin:10px 0;}
  button{padding:10px 24px;background:#0066ff;color:#fff;border:none;border-radius:8px;
    font-size:.95rem;font-weight:700;cursor:pointer;}
  .result{margin-top:16px;padding:14px;background:#f1f5f9;border-radius:8px;
    font-family:monospace;font-size:.85rem;word-break:break-all;display:none;}
  .label{font-size:.78rem;color:#64748b;margin-bottom:4px;}
</style>
</head>
<body>
<h1>EWD CMS — Passwort-Hash Generator</h1>
<p style="font-size:.9rem;color:#64748b;">Für jeden neuen Kunden ein Passwort eingeben → Hash kopieren → in data-pw-hash einfügen.</p>
<input type="password" id="pw" placeholder="Passwort für den Kunden">
<button onclick="generate()">Hash generieren</button>
<div class="result" id="result">
  <div class="label">data-pw-hash (in Script-Tag einfügen):</div>
  <div id="hash"></div>
</div>
<script>
async function generate() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  const hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  document.getElementById('hash').textContent = hash;
  document.getElementById('result').style.display = 'block';
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') generate(); });
</script>
</body>
</html>
